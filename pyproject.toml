[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-credit-risk-prediction"
version = "0.1.0"
description = "Credit-risk prediction on the German Credit data: calibration, cost-sensitive thresholds, nested CV, SHAP and a fairness check"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Jane Rose Ferdinant" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "optuna>=3.5",
  "shap>=0.45",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
